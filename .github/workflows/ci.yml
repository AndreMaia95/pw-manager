# Testes do vault-core (ADR-0016).
#
# - Linux, a cada push e em pull requests: formatação, lints, todos os testes
#   (incluindo os vetores de teste fixos) e uma execução curta de cada alvo de
#   fuzzing.
# - macOS e Windows: a cada push, uma vez por semana e quando lançado à mão
#   (Actions > CI > Run workflow). Não correm em pull requests.
#
# Sem segredos nem dados reais: os vetores de teste usam uma palavra-passe
# conhecida e não protegem nada (tests/vectors/README.md).

name: CI

on:
  push:
  pull_request:
  schedule:
    # Segunda-feira às 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (fmt, clippy, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Formatação
        run: |
          cargo fmt --all --check
          cargo fmt --check --manifest-path crates/vault-core/fuzz/Cargo.toml
      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Testes
        run: cargo test --workspace --locked -- --include-ignored

  fuzz:
    name: Linux (fuzzing curto)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/vault-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/vault-core/fuzz -> target
      - name: Instalar o cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Semear o corpus com os vetores de teste
        run: |
          mkdir -p fuzz/corpus/keyring fuzz/corpus/replica fuzz/corpus/replica_body
          for dir in tests/vectors/*/*/; do
            name=$(echo "$dir" | tr '/' '-')
            cp "$dir/keyring" "fuzz/corpus/keyring/$name"
            for replica in "$dir"replicas/*; do
              cp "$replica" "fuzz/corpus/replica/$name$(basename "$replica")"
            done
          done
          # {"created_at_ms": 0}, o mesmo que REPLICA_BODY_SEED em tests/fuzz_harnesses.rs.
          printf '\xa1\x6dcreated_at_ms\x00' > fuzz/corpus/replica_body/seed
      - name: Fuzzing (60 s por alvo)
        run: |
          for target in keyring replica replica_body; do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- -max_total_time=60
            echo "::endgroup::"
          done
      - name: Guardar o input que falhou
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/vault-core/fuzz/artifacts/
          if-no-files-found: ignore

  other-os:
    name: ${{ matrix.os }} (testes)
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Testes
        run: cargo test --workspace --locked -- --include-ignored
